---
name: 'Build version'

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        required: false
        description: 'Select which branch/version of DOMjudge/DOMjudge to use'
        # default: 'main' 

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
        docker_tags: ${{ steps.dowload_domjudge.outputs.docker_tags }}
        domjudge_cache_key: ${{ steps.domjudge_cache_key.outputs.domjudge_cache_key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Download Domjudge
        id: dowload_domjudge
        run: |
          FILE="domjudge.tar.gz"
          REPO="DOMjudge/domjudge"
          INPUT_VERSION=${{ github.event.inputs.version }}
          # No version asked for: build the one this repository pins, so the
          # domserver image and the Nix judgehost are the same DOMjudge.
          # Dispatching with a version still overrides it, for testing.
          if [[ "$INPUT_VERSION" == "" ]]; then
            INPUT_VERSION=$(jq -r .version nix/domjudge.json)
            echo "Using pinned DOMjudge version $INPUT_VERSION (nix/domjudge.json)"
          fi
          DOCKER_TAGS=( "latest" )
          DOCKER_TAGS+=( "packaging-$(git rev-parse --short HEAD)" )

          echo "Trying to find matching tag"

          DJ_TAGS=$(curl -s https://api.github.com/repos/${REPO}/git/refs/tags | jq 'reverse | ((.[].ref) / "refs/tags/" )[1]'  | rev | cut -c2- | rev | cut -c2- | grep -E '^[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$')
          RELEASE_VERSION=$(echo "${DJ_TAGS}" | head -n 1)
          TAG_TO_BUILD=""

          if [[ "$INPUT_VERSION" == "release" || "$INPUT_VERSION" == "$RELEASE_VERSION" ]]; then
            echo "Building highest version tag $RELEASE_VERSION"
            TAG_TO_BUILD=$RELEASE_VERSION
            DOCKER_TAGS+=( "$RELEASE_VERSION" )
          fi

          if [[ "$TAG_TO_BUILD" == "" ]] && echo "$DJ_TAGS" | grep -F -q -x "$INPUT_VERSION"; then
            echo "Building matching version tag $RELEASE_VERSION"
            TAG_TO_BUILD=$INPUT_VERSION
            DOCKER_TAGS+=( "$INPUT_VERSION" )
          fi

          if [[ "$TAG_TO_BUILD" != "" ]]; then
            echo "DOCKER_TAGS: ${DOCKER_TAGS[*]}"
            echo "TAG_TO_BUILD: $TAG_TO_BUILD"
            echo "docker_tags=${DOCKER_TAGS[*]}" >> $GITHUB_OUTPUT
            wget "https://github.com/${REPO}/archive/refs/tags/${TAG_TO_BUILD}.tar.gz" -O ${FILE}
            exit 0
          fi

          echo "Trying to find matching branch"

          DJ_BRANCHES=$(curl -s https://api.github.com/repos/${REPO}/branches?per_page=100 | jq '.[].name' | rev | cut -c2- | rev | cut -c2-)
          BRANCH_TO_BUILD=""

          if [[ "$BRANCH_TO_BUILD" == "" ]] && echo "$DJ_BRANCHES" | grep -F -q -x "$INPUT_VERSION"; then
            echo "Found matching branch $INPUT_VERSION"
            BRANCH_TO_BUILD=$INPUT_VERSION
            DOCKER_TAGS+=( "$INPUT_VERSION" )
          fi

          if [[ "$BRANCH_TO_BUILD" != "" ]]; then
            echo "DOCKER_TAGS: ${DOCKER_TAGS[*]}"
            echo "BRANCH_TO_BUILD: $BRANCH_TO_BUILD"
            echo "docker_tags=${DOCKER_TAGS[*]}" >> $GITHUB_OUTPUT
            wget "https://github.com/${REPO}/archive/refs/heads/${BRANCH_TO_BUILD}.tar.gz" -O ${FILE}
            exit 0
          fi

          DJ_COMMITS=$(curl -s https://api.github.com/repos/${REPO}/commits | jq '.[].sha' | rev | cut -c2- | rev | cut -c2-)
          COMMIT_TO_BUILD=""

          if [[ "$COMMIT_TO_BUILD" == "" ]] && echo "$DJ_COMMITS" | grep -F -q -x "$INPUT_VERSION"; then
            echo "Found matching commit $INPUT_VERSION"
            COMMIT_TO_BUILD=$INPUT_VERSION
            DOCKER_TAGS+=( "$INPUT_VERSION" )
          fi

          if [[ "$COMMIT_TO_BUILD" != "" ]]; then
            echo "DOCKER_TAGS: ${DOCKER_TAGS[*]}"
            echo "COMMIT_TO_BUILD: $COMMIT_TO_BUILD"
            echo "docker_tags=${DOCKER_TAGS[*]}" >> $GITHUB_OUTPUT
            wget "https://github.com/${REPO}/archive/${COMMIT_TO_BUILD}.tar.gz" -O ${FILE}
            exit 0
          fi

          exit 1
      - id: domjudge_cache_key
        run: echo "domjudge_cache_key=${{ runner.os }}-${{ hashFiles('domjudge.tar.gz') }}" >> $GITHUB_OUTPUT
      - name: Print docker tags
        run: echo ${{ steps.dowload_domjudge.outputs.docker_tags }}
      - uses: actions/cache@v3
        with:
          path: domjudge.tar.gz
          key: ${{ runner.os }}-${{ hashFiles('domjudge.tar.gz') }}

  build_domserver:
    needs: get_version
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commits nix/domserver-image.json back
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - uses: actions/cache@v3
        with:
          path: domjudge.tar.gz
          key: ${{ needs.get_version.outputs.domjudge_cache_key }}

      - run: mv domjudge.tar.gz ./docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - name: Build container
        run: |
          cd ./docker
          sudo bash -e ./build-domjudge.sh "domjudge/domserver:chipcie"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tag and push
        run: |
          IMAGE_ID=$(echo ${{ env.REGISTRY }}/${{ env.REPO_NAME }} | tr '[A-Z]' '[a-z]')

          for TAG in ${{ needs.get_version.outputs.docker_tags }}; do
            docker tag domjudge/domserver:chipcie ${IMAGE_ID}/domserver:$TAG
            docker push ${IMAGE_ID}/domserver:$TAG
          done

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Record the pushed domserver in nix/domserver-image.json
        # So a consumer that follows this flake (icpc-nix) gets this
        # domserver and the matching judgehost from one input bump,
        # instead of a digest pasted in by hand.
        run: |
          IMAGE_ID=$(echo ${{ env.REGISTRY }}/${{ env.REPO_NAME }} | tr '[A-Z]' '[a-z]')
          VERSION=$(jq -r .version nix/domjudge.json)

          nix run nixpkgs#nix-prefetch-docker -- \
            --quiet --json --image-name "${IMAGE_ID}/domserver" --image-tag "$VERSION" \
            > pin.json

          jq --slurpfile pin pin.json '
            .imageName = $pin[0].imageName
            | .finalImageTag = $pin[0].finalImageTag
            | .imageDigest = $pin[0].imageDigest
            | .sha256 = $pin[0].sha256
          ' nix/domserver-image.json > nix/domserver-image.json.new
          mv nix/domserver-image.json.new nix/domserver-image.json

          if git diff --quiet nix/domserver-image.json; then
            echo "domserver pin unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/domserver-image.json
          # [skip ci]: this commit lands on master, which this workflow
          # triggers on, and rebuilding the image it just recorded would
          # loop forever.
          git commit -m "domserver: record $VERSION image digest [skip ci]"
          git push

  build_judgehost:
    needs: get_version
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - uses: actions/cache@v3
        with:
          path: domjudge.tar.gz
          key: ${{ needs.get_version.outputs.domjudge_cache_key }}

      - run: mv domjudge.tar.gz ./docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1

      - name: Build container
        run: |
          cd ./docker
          sudo bash -e ./build-judgehost.sh "domjudge/judgehost:chipcie"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tag and push
        run: |
          IMAGE_ID=$(echo ${{ env.REGISTRY }}/${{ env.REPO_NAME }} | tr '[A-Z]' '[a-z]')

          for TAG in ${{ needs.get_version.outputs.docker_tags }}; do
            docker tag domjudge/judgehost:chipcie ${IMAGE_ID}/judgehost:$TAG
            docker push ${IMAGE_ID}/judgehost:$TAG
          done

  build_judgehost_nix:
    # The Nix-built judgehost (nix/, flake.nix): no Ubuntu base, no apt, and
    # a chroot that is one Nix closure. Built here for standalone use and to
    # prove it keeps working; icpc-nix builds its own from this flake's
    # lib.mkJudgehostImage with the toolchain versions it pins.
    needs: get_version
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Free disk space
        # The chroot alone is ~1.5 GB, and a hosted runner starts with
        # little room to spare.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Compile and run every language inside the chroot
        run: nix flake check -L

      - name: Build the image
        run: nix build .#judgehost -L

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tag and push
        run: |
          IMAGE_ID=$(echo ${{ env.REGISTRY }}/${{ env.REPO_NAME }} | tr '[A-Z]' '[a-z]')
          docker load < result

          for TAG in ${{ needs.get_version.outputs.docker_tags }}; do
            docker tag judgehost-nix:latest ${IMAGE_ID}/judgehost-nix:$TAG
            docker push ${IMAGE_ID}/judgehost-nix:$TAG
          done
